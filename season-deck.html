html,body{height:100%}

.slide.on{display:flex}
h1{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:64px;line-height:.95;margin:0 0 8px;letter-spacing:-.01em}
h2{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:44px;line-height:1;margin:0 0 6px}
.sub{color:var(--ink2);font-size:18px;margin-bottom:22px}
.big{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:150px;line-height:.9;color:var(--gold)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tile{background:var(--card);border-radius:14px;padding:18px 20px}
.tile .k{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut)}
.tile .v{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:56px;line-height:1;margin-top:6px}
.tile .d{font-size:14px;color:var(--ink2);margin-top:6px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;flex:1;min-height:0}
.list{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:18px}
.list li{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:baseline;background:var(--card);border-radius:10px;padding:10px 14px}
.list .n{color:var(--mut);font-variant-numeric:tabular-nums}.list b{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:28px;color:#fff}.list small{color:var(--ink2);font-size:14px;display:block}
.strip{display:grid;grid-template-columns:repeat(17,1fr);gap:6px;margin-top:10px}
.strip div{aspect-ratio:1/1.3;border-radius:8px;display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px;color:#fff}
.strip .W{background:var(--win)}.strip .L{background:var(--loss)}.strip .N{background:#4a4560}
.strip small{display:block;font-size:11px;font-family:"IBM Plex Sans",sans-serif;font-weight:500;opacity:.9}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.f{background:var(--card);border-left:4px solid var(--acc);border-radius:12px;padding:16px 18px}
.f.top{border-left-color:var(--gold)}
.f .b{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:44px;line-height:1;color:var(--acc)}.f.top .b{color:var(--gold)}
.f .h{font-weight:600;font-size:16px;margin-top:6px;line-height:1.3}.f .t{font-size:13px;color:var(--ink2);margin-top:4px;line-height:1.4}
.aw{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.aw div{background:var(--card);border-radius:12px;padding:12px 14px;border-top:3px solid var(--acc)}.aw div.off{border-top-color:var(--gold)}
.aw .k{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut)}.aw .w{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:24px;margin-top:4px}.aw .d{font-size:13px;color:var(--ink2)}
.foot{position:absolute;left:64px;right:64px;bottom:22px;display:flex;justify-content:space-between;font-size:12px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
.nav{position:fixed;right:20px;bottom:16px;display:flex;gap:8px;align-items:center;color:var(--mut);font-size:13px}
.nav button{background:var(--card);border:1px solid rgba(255,255,255,.15);color:var(--ink);border-radius:8px;width:36px;height:32px;cursor:pointer;font-size:16px}
p.story{font-size:20px;line-height:1.55;color:var(--ink2);max-width:60ch}p.story b{color:#fff}
.bul{margin:0;padding-left:22px;font-size:20px;line-height:1.7;color:var(--ink2)}.bul b{color:#fff}
@media print{body{overflow:visible;background:#fff}.deck{display:block;padding:0}.slide{display:flex!important;page-break-after:always;width:100%;border-radius:0;box-shadow:none;margin:0}.nav{display:none}}

</style>

S.push(`<h2>Seventeen fixtures</h2><div class="sub">Green won, red lost, grey no result or forfeit. RoyalsPunters' total under each.</div><div class="strip">${D.matches.map(m=>`<div class="${m.result==='Won'?'W':m.result==='Lost'?'L':'N'}"><span>${ml(m.n)}<small>${code(m.opp)}</small><small>${m.rp?m.rp:m.result==='No Result'?'N/R':'forfeit'}</small></span></div>`).join('')}</div><p class="story" style="margin-top:28px">Five straight wins from Match 3 to Match 7, then a season of two halves: 9–1 against the bottom five, 0–5 against the top three. Won every game at Linbrook Park; 1–4 at CC1.</p>`);
// 4 what decided
const heads=[['6–0','Under 6.5 balls per boundary, never lost',true],['3–0','Bat first and post 200+'],['208','Highest successful chase — 0–4 chasing 220+'],['0–3','When an opposition batter reached 90'],['5.97 v 8.61','Bowling economy in wins v losses'],['193','Wides conceded — 32 free overs']];
S.push(`<h2>What decided the season</h2><div class="sub">Six findings from the workbook.</div><div class="cards">${heads.map(([b,h,top],i)=>`<div class="f ${top?'top':''}"><div class="b">${b}</div><div class="h">${h}</div><div class="t">${esc(D.findings[i]||'')}</div></div>`).join('')}</div>`);
// 5 batting
const bi=D.innings.slice().sort((a,b)=>b.runs-a.runs||a.balls-b.balls).slice(0,5);
S.push(`<h2>Batting</h2><div class="sub">Season runs and the best innings.</div><div class="cols"><ul class="list">${D.batting.slice(0,6).map((b,i)=>`<li><span class="n">${i+1}</span><span>${esc(b.p)}<small>${b.inn} inn · avg ${b.avg??'—'} · ${b.f}×4 ${b.s}×6</small></span><b>${b.runs}</b></li>`).join('')}</ul><ul class="list">${bi.map((x,i)=>`<li><span class="n">${i+1}</span><span>${esc(x.p)}<small>${ml(x.n)} v ${code(M2[x.n].opp)} · ${M2[x.n].result}</small></span><b>${x.runs} <span style="font-size:16px;color:var(--ink2)">(${x.balls})</span></b></li>`).join('')}</ul></div>`);
// 6 bowling
const bs=D.spells.slice().sort((a,b)=>b.w-a.w||a.runs-b.runs).slice(0,5);
S.push(`<h2>Bowling</h2><div class="sub">Season wickets and the best spells.</div><div class="cols"><ul class="list">${D.bowling.slice(0,6).map((b,i)=>`<li><span class="n">${i+1}</span><span>${esc(b.p)}<small>${b.overs} ov · econ ${b.eco.toFixed(2)} · ${b.dotpct.toFixed(0)}% dots</small></span><b>${b.w}</b></li>`).join('')}</ul><ul class="list">${bs.map((x,i)=>`<li><span class="n">${i+1}</span><span>${esc(x.p)}<small>${ml(x.n)} v ${code(x.opp)} · ${x.overs} ov</small></span><b>${x.w}/${x.runs}</b></li>`).join('')}</ul></div>`);
// 7 fielding + partnerships
const st=D.partnerships.filter(p=>p.team==='RoyalsPunters').sort((a,b)=>b.runs-a.runs).slice(0,5);
S.push(`<h2>Fielding and partnerships</h2><div class="sub">Dismissals in the field, and the biggest stands.</div><div class="cols"><ul class="list">${D.fielding.slice(0,6).map((f,i)=>`<li><span class="n">${i+1}</span><span>${esc(f.p)}<small>${f.ct} ct · ${f.wk} wk ct · ${f.dro+f.iro} run-outs · ${f.st} st</small></span><b>${f.total}</b></li>`).join('')}</ul><ul class="list">${st.map((s,i)=>`<li><span class="n">${i+1}</span><span>${esc(s.a)} &amp; ${esc(s.b)}<small>${s.wkt}${s.wkt===1?'st':s.wkt===2?'nd':s.wkt===3?'rd':'th'} wicket · ${ml(s.n)} v ${code(M2[s.n].opp)}</small></span><b>${s.runs}</b></li>`).join('')}</ul></div>`);
// 8 phases (computed from the ball-by-ball; powerplay = overs 1–6)
{
  const unpack=a=>a.map(r=>({n:r[0],over:r[1],runs:r[5],ev:r[7],legal:r[8]}));const BAT=unpack(D.bat),BOWL=unpack(D.bowl);
  const rr=(a,f)=>{const s=a.filter(f);const lb=s.filter(b=>b.legal).length;return lb?(6*s.reduce((x,b)=>x+b.runs+b.ev,0)/lb).toFixed(2):'—';};
  const PH=[['Overs 1–6 · powerplay',b=>b.over<=6],['Overs 7–17',b=>b.over>=7&&b.over<=17],['Overs 18–25',b=>b.over>=18]];
  const W=b=>won(b.n),L=b=>!won(b.n);
  S.push(`<h2>The phases that decided the season</h2><div class="sub">Run rates by phase, wins against losses.</div><div class="tiles" style="grid-template-columns:repeat(3,1fr)">${PH.map(([k,f])=>`<div class="tile"><div class="k">${k}</div><div class="v" style="font-size:40px">${rr(BAT.filter(W),f)} v ${rr(BAT.filter(L),f)}</div><div class="d">batting, wins v losses</div><div class="v" style="font-size:40px;margin-top:10px">${rr(BOWL.filter(W),f)} v ${rr(BOWL.filter(L),f)}</div><div class="d">bowling, wins v losses</div></div>`).join('')}</div><p class="story" style="margin-top:22px">Dot-ball rate with the ball: <b>49% in wins, 37% in losses</b>. Average opposition partnership: <b>16 in wins, 30 in losses</b>.</p>`);
}
// 9 eliminator
S.push(`<h2>The Eliminator</h2><div class="sub">Match 17 v Clarion County Eagles · lost by 23 runs chasing 220.</div><p class="story">Third meeting with Clarion, third defeat. <b>Chetan Rajput and Vineet Singh put on 94</b> for the second wicket and RoyalsPunters were <b>101/2 after 12</b>, needing 119 off 78. Then <b>138/5 after 17</b> — four wickets for 37 as the required rate climbed past 10 — and 55 off the last 12 balls was never on. <b>Mukhtar Ahmed</b> was player of the match against us for the second time.</p><ul class="bul"><li>Across the three Clarion games: Mukhtar Ahmed <b>126 runs</b> and <b>6 wickets</b>, Saif Badar 110 at a strike rate of 175.</li><li>Our death-overs economy against them: 10.3, 13.0 and 7.6.</li></ul>`);
// 10 awards
const eco=D.bowling.filter(b=>b.overs>=10).sort((a,b)=>a.eco-b.eco)[0];const stand=st[0];
S.push(`<h2>Season awards</h2><div class="sub">Computed from the workbook; official CricClubs awards in gold.</div><div class="aw">${[['Most valuable (composite)','Varun Belide','550 pts'],['Most runs',D.batting[0].p,`${D.batting[0].runs} runs`],['Most wickets',D.bowling[0].p,`${D.bowling[0].w} wickets`],['Best economy',eco.p,eco.eco.toFixed(2)],['Best fielder',D.fielding[0].p,`${D.fielding[0].total} dismissals`],['Best innings',bi[0].p,`${bi[0].runs} (${bi[0].balls}) · ${ml(bi[0].n)}`],['Best spell',bs[0].p,`${bs[0].w}/${bs[0].runs} · ${ml(bs[0].n)}`],['Innings of the year','Rohit Soni','61 (40) chasing 208 · M11'],['Best partnership',`${stand.a.split(' ')[0]} & ${stand.b.split(' ')[0]}`,`${stand.runs} · ${ml(stand.n)}`],['CricClubs Top Performer',D.ratings[0].p,`${D.ratings[0].total} points`,'off'],['Most player-of-the-match','Vineet Singh','2 awards','off']].map(([k,w,d,c])=>`<div class="${c||''}"><div class="k">${k}</div><div class="w">${esc(w)}</div><div class="d">${d}</div></div>`).join('')}</div>`);
// 11 next season
S.push(`<h2>Into 2027</h2><div class="sub">Three things the numbers point at.</div><ul class="bul" style="font-size:24px"><li><b>The death overs.</b> Conceded 10.3 an over in losses in overs 18–25, scored only 6.85 there when losing. Every defeat ran through that phase.</li><li><b>The top three.</b> 0–5 against Pitts Jaguars, Maverick Reds and Clarion. 9–1 against everyone else.</li><li><b>Free runs.</b> 193 wide runs — 32 overs' worth. Tapan Ukani's 0.11 wides an over is the model; three regulars gave more than one an over.</li></ul>`);
const deck=document.getElementById('deck');deck.innerHTML=S.map((s,i)=>`<section class="slide">${s}${foot(i+1,S.length)}</section>`).join('');
const slides=[...deck.children];let i=0;try{i=Math.min(S.length-1,+(location.hash.slice(1)||1)-1)||0;}catch(e){}
const show=k=>{i=(k+S.length)%S.length;slides.forEach((s,j)=>s.classList.toggle('on',j===i));document.getElementById('pg').textContent=`${i+1} / ${S.length}`;try{history.replaceState(null,'','#'+(i+1));}catch(e){}};
document.getElementById('prev').onclick=()=>show(i-1);document.getElementById('next').onclick=()=>show(i+1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')show(i+1);if(e.key==='ArrowLeft')show(i-1);});
let tx=null;addEventListener('touchstart',e=>tx=e.touches[0].clientX);addEventListener('touchend',e=>{if(tx==null)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)show(i+(d<0?1:-1));tx=null;});
show(i);
</script>
